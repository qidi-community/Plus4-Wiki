# box_extras_sandbox.cfg
# Required sections for the community box_extras.py (customisable_qidibox_firmware)
# that are MISSING from the stock QIDI Plus 4 config. Documented by the sandbox on 2026-08-05.
# Without these, klippy fails to boot after a .so -> .py swap (real-printer brick scare).
#
# PINS VERIFIED from QIDI firmware primary source:
#   qidi-q2-fw/firmware/home/mks/cfg_with_1  (the box.cfg template box_detect.so generates)
#   [box_extras] b_button_pin : ^mcu_box1:PB1
#                b_endstop_pin : mcu_box1:PA9
#                e_endstop_pin : mcu_box1:PA10
#                buffer_pin    : ^mcu_box1:PB0   (used by stock .so; optional for community .py)

[box_extras]
b_button_pin: ^mcu_box1:PB1
# Sandbox Fix #9: filament temp list (real file copied from qidi-q2-fw dump)
filament_list_path: /home/kgrames/qidi_project/sandbox/configs/officiall_filas_list.cfg
b_endstop_pin: mcu_box1:PA9
e_endstop_pin: mcu_box1:PA10
buffer_pin: ^mcu_box1:PB0

# Dummy probe: registers the 'probe' pin chip used by stepper_z virtual endstop
# (real qdprobe removed for sandbox; probing is not under test)
[probe]
pin: mcu_box1:PA8
x_offset: 0
y_offset: 0
z_offset: 0
speed: 5

[filament_motion_sensor box_motion_sensor]
switch_pin: mcu:PA7
detection_length: 10
extruder: extruder

[gcode_macro RESUME_PRINT]
description: Sandbox stub - real printer gets this from QIDI firmware layer
gcode:
    M24

